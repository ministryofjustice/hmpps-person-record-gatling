name: Gatling performance test run

on:
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch:
    inputs:
      envName:
        description: "Optional: env"
        required: false
        default: "dev"
        type: choice
        options:
          - dev
      getPrisonNumber:
        description: "Optional: getPrisonNumber requests/sec"
        required: false
        default: "15"
        type: string
      getCrnNumber:
        description: "Optional: getCrnNumber requests/sec"
        required: false
        default: "1"
        type: string
      getDefendantId:
        description: "Optional: getDefendantId requests/sec"
        required: false
        default: "1"
        type: string
      getCrnAddress:
        description: "Optional: getCrnAddress requests/sec"
        required: false
        default: "1"
        type: string
      duration:
        description: "Optional: execution time"
        required: false
        default: "360"
        type: string
      rampUpDuration:
        description: "Optional: ramp-up duration (seconds) before steady-state load"
        required: false
        default: "30"
        type: string
jobs:
  gatling-run:
    name: Run Gatling simulations
    runs-on: [ self-hosted, hmpps-github-actions-runner ]
    permissions:
      contents: read
      actions: read
    timeout-minutes: 300
    env:
      CLIENT_ID: ${{ secrets.GATLING_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.GATLING_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Touch env file
        run: touch .env

      - name: Start Gatling
        env:
          CLIENT_ID: ${{ secrets.GATLING_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GATLING_CLIENT_SECRET }}
        run: |
         
          PRISON_NUMBER="${{ github.event.inputs.getPrisonNumber }}"
          PRISON_NUMBER="${PRISON_NUMBER:-15}"
          CRN_NUMBER="${{ github.event.inputs.getCrnNumber }}"
          CRN_NUMBER="${CRN_NUMBER:-1}"
          DEFENDANT_ID="${{ github.event.inputs.getDefendantId }}"
          DEFENDANT_ID="${DEFENDANT_ID:-1}"
          CRN_ADDRESS="${{ github.event.inputs.getCrnAddress }}"
          CRN_ADDRESS="${CRN_ADDRESS:-1}"
          ENV="${{ github.event.inputs.envName }}"
          ENV="${ENV:-dev}"
          DURATION="${{ github.event.inputs.duration }}"
          DURATION="${DURATION:-360}"
          RAMP_UP_DURATION="${{ github.event.inputs.rampUpDuration }}"
          RAMP_UP_DURATION="${RAMP_UP_DURATION:-30}"
          set -eo pipefail
          
          CLIENT_ID="${CLIENT_ID}" \
          CLIENT_SECRET="${CLIENT_SECRET}" \
          ./gradlew gatlingRunCi \
          --no-daemon \
          -DgetPrisonNumber="$PRISON_NUMBER" \
          -DgetCrnNumber="$CRN_NUMBER" \
          -DgetDefendantId="$DEFENDANT_ID" \
          -DgetCrnAddress="$CRN_ADDRESS" \
          -Denv="$ENV" \
          -Dduration="$DURATION" \
          -DrampUpDuration="$RAMP_UP_DURATION"


      - name: Upload Gatling reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gatling-reports
          path: |
            gatling/build/reports/gatling/**
            **/build/reports/gatling/**
          if-no-files-found: warn


      - name: Slack Notification
        if: failure()
        uses: slackapi/slack-github-action@v4
        with:
            method: chat.postMessage
            token: ${{ secrets.HMPPS_SLACK_BOT_TOKEN }}
            payload: |
              channel: "${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID }}"
              attachments:
                - color: "#df2c2c"
                  blocks:
                    - type: section
                      text:
                        type: mrkdwn
                        text: "❌ *Gatling Performance Test Failure*\n*Repository:* ${{ github.repository }}\n*Branch:* `${{ github.ref_name }}`\n*Workflow Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow>"