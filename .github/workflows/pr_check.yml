name: PR check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  gradle-check:
    name: Run ktlint and unit tests
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/gradle_verify.yml@v2 # WORKFLOW_VERSION
    with:
      gradle-command: './gradlew check'
      upload-build-artifacts: false
      upload-test-artifacts: true
      java-version: '25'
    permissions:
      contents: read
      actions: read
